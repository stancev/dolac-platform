services:
  postgres:
    image: postgres:16
    container_name: dolac-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dolac
      POSTGRES_PASSWORD: dolac
      POSTGRES_DB: dolac_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
